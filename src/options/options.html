<!doctype html>

    <title>Pinterest Cleaner Settings</title>
    <link rel="stylesheet" href="options.css">

            <span id="sidebar-sub">Settings</span>
          </div>
        </div>

      <main class="main">

            <p id="view-desc" class="muted">Local filtering preferences</p>
